<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCOREVINI AI - V2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030303;
            --card-bg: #0c0707;
            --accent-blood: #8B0000;
            --accent-red: #FF0033;
            --border-color: #2b0a0a;
            --text-main: #FFFFFF;
            --text-muted: #8C8C8C;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; }
        aside { width: 280px; background: #080101; border-right: 2px solid var(--border-color); padding: 2.5rem 1.5rem; display: flex; flex-direction: column; justify-content: space-between; }
        .logo-text { font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; color: var(--text-main); }
        .logo-text span { color: var(--accent-red); }
        .nav-links { list-style: none; display: flex; flex-direction: column; gap: 0.8rem; margin-top: 3rem; }
        .nav-links button { width: 100%; background: rgba(139, 0, 0, 0.4); border: none; display: flex; align-items: center; gap: 1rem; padding: 0.85rem 1rem; color: var(--text-main); border-radius: 6px; font-weight: 700; font-size: 1.1rem; cursor: pointer; border-left: 4px solid var(--accent-red); text-align: left; }
        main { flex: 1; padding: 2.5rem; overflow-y: auto; }
        .hero { background: linear-gradient(135deg, rgba(80, 0, 0, 0.6) 0%, rgba(5, 2, 2, 0.95) 100%); border: 1px solid var(--accent-blood); border-radius: 12px; padding: 3rem; margin-bottom: 3rem; }
        .hero h1 { font-family: 'Cinzel', serif; font-size: 2.3rem; margin-bottom: 0.75rem; text-transform: uppercase; }
        .hero h1 span { color: var(--accent-red); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
        .card:hover { border-color: var(--accent-red); transform: translateY(-3px); }
        .card-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; border-bottom: 1px solid #1a0808; padding-bottom: 0.5rem; }
        .teams { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.2rem; text-align: center; }
        .prediction-box { background: #050202; border: 1px solid #200808; border-radius: 8px; padding: 1.2rem; margin-bottom: 1rem; }
        .market-item { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px dashed rgba(139,0,0,0.3); font-size: 0.9rem; color: var(--text-muted); }
        .market-val { color: #ff3333; font-weight: 700; }
        .probability { font-size: 1.8rem; font-weight: 900; color: var(--accent-red); font-family: 'Cinzel', serif; text-align: center; margin-top: 0.5rem; }
        .card-footer { text-align: center; font-size: 0.85rem; color: #ff4d4d; font-weight: 700; text-transform: uppercase; }
    </style>
</head>
<body>
    <aside>
        <div>
            <div class="logo-text">SCOREVINI <span>AI</span></div>
            <ul class="nav-links">
                <li><button>🩸 Accueil & Pronos</button></li>
            </ul>
        </div>
        <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center;">SANG & VICTOIRE</div>
    </aside>

    <main>
        <div class="hero">
            <h1>LE TERRAIN N'APPARTIENT QU'À CEUX <span>QUI DOMINENT</span></h1>
            <p>Analyse automatisée et prédictions algorithmiques en temps réel.</p>
        </div>

        <div class="grid" id="predictionsGrid">
            <div style="color: var(--text-muted);">Connexion au système...</div>
        </div>
    </main>

    <script>
        const supabaseUrl = "https://tqtkzkqampddxacmstk.supabase.co";
        const supabaseKey = "sb_publishable_KyUSPjb3kZ-exriMinWgOg_8Jck1VNa";

        async function loadEverything() {
            let matchesToDisplay = [
                { competition: "Premier League", home_team: "Arsenal", away_team: "Chelsea" },
                { competition: "Liga", home_team: "Real Madrid", away_team: "FC Barcelone" },
                { competition: "Serie A", home_team: "AC Milan", away_team: "Inter Milan" }
            ];

            try {
                const response = await fetch(`${supabaseUrl}/rest/v1/matches?select=*`, {
                    headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.length > 0) {
                        matchesToDisplay = data;
                    }
                }
            } catch (err) {
                console.error("Mode hors-ligne / secours activé");
            }

            const grid = document.getElementById('predictionsGrid');
            grid.innerHTML = matchesToDisplay.map(m => `
                <div class="card">
                    <div>
                        <div class="card-header">
                            <span>${m.competition || 'Championnat'}</span>
                            <span>En direct</span>
                        </div>
                        <div class="teams">${m.home_team || m.homeTeam} <span style="color:var(--accent-red)">VS</span> ${m.away_team || m.awayTeam}</div>
                        <div class="prediction-box">
                            <div class="market-item"><span>🎯 Prono Principal</span><span class="market-val">Victoire ${m.home_team || m.homeTeam}</span></div>
                            <div class="market-item"><span>⚽ Total Buts</span><span class="market-val">Plus de 2.5 Buts</span></div>
                            <div class="probability">88%</div>
                        </div>
                    </div>
                    <div class="card-footer">PRONOSTIC VALIDE 🩸</div>
                </div>
            `).join('');
        }

        loadEverything();
    </script>
</body>
</html>
