<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCOREVINI AI — Système Automatisé</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a; --card: #0f1424; --border: #1c2a33; --green: #4ade80; --green2: #66c26e;
            --text: #fff; --muted: #7c8597; --gold: #f0b13c; --accent-red: #FF0033;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 32px 24px; min-height: 100vh; }

        /* Onglets dates */
        .sx-tabs { display: flex; justify-content: center; gap: 56px; margin-bottom: 40px; }
        .sx-tab { background: none; border: 0; cursor: pointer; text-align: center; color: var(--muted); padding: 0; }
        .sx-tab b { display: block; font-size: 20px; font-weight: 600; }
        .sx-tab span { display: block; font-size: 14px; letter-spacing: .12em; margin-top: 6px; text-transform: uppercase; }
        .sx-tab.active { color: var(--text); }
        .sx-tab.active span { color: var(--green); }

        /* Grille des cartes (Style Concurrence) */
        .hp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 28px; max-width: 1200px; margin: 0 auto; }
        .hp-card {
            background: var(--card); border: 1px solid #1f4a38; border-left: 4px solid var(--green2);
            border-radius: 22px; padding: 28px; box-shadow: 0 0 28px rgba(74,222,128,.18);
        }
        .hp-badges { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
        .hp-badge { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 9px 18px; font-size: 16px; font-weight: 600; }
        .hp-badge.top { background: var(--gold); color: #1a1a1a; }
        .hp-badge.safe { border: 1px solid #1f5a3a; color: var(--green); background: transparent; }
        
        .hp-meta { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 16px; margin-bottom: 18px; }
        .hp-teams { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid #151c2c; margin-bottom: 20px; }
        .hp-team { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; }
        .hp-team.win { color: var(--green); }
        .hp-logo { width: 44px; height: 44px; border-radius: 50%; background: #1a2236; }
        .hp-vs { color: var(--muted); font-size: 22px; font-weight: 600; }

        .hp-pick { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
        .hp-pick-name { font-size: 20px; font-weight: 500; }
        .hp-pick-pct { font-size: 32px; font-weight: 700; color: var(--green); }
        .hp-bar { height: 12px; border-radius: 999px; background: #151c2c; overflow: hidden; margin-bottom: 24px; }
        .hp-bar i { display: block; height: 100%; background: var(--green2); border-radius: 999px; }

        .hp-opts { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 28px; }
        .hp-opt { background: #121828; border: 1px solid transparent; border-radius: 16px; padding: 18px 8px; text-align: center; }
        .hp-opt small { display: block; color: #aab2c2; font-size: 16px; margin-bottom: 6px; }
        .hp-opt b { font-size: 22px; font-weight: 700; color: #d6dbe6; }
        .hp-opt.active { background: #12301f; border-color: #2a7a4a; }
        .hp-opt.active small, .hp-opt.active b { color: var(--green); }

        .hp-actions { display: flex; gap: 14px; }
        .hp-bet { flex: 1; background: var(--green2); color: #0b1a10; border: 0; border-radius: 16px; padding: 18px; font-size: 20px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; }
    </style>
</head>
<body>

    <!-- Onglets dynamiques de dates (comme sur le site de la concurrence) -->
    <div class="sx-tabs" id="sxTabs">
        <button class="sx-tab" data-offset="-1"><b>Hier</b><span></span></button>
        <button class="sx-tab active" data-offset="0"><b>Aujourd'hui</b><span></span></button>
        <button class="sx-tab" data-offset="1"><b>Demain</b><span></span></button>
    </div>

    <!-- Grille automatisée des matchs -->
    <div class="hp-grid" id="hpGrid">
        <div style="grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 3rem;">
            Chargement automatique des matchs...
        </div>
    </div>

    <script>
        // Initialisation automatique des dates sur les onglets
        (function(){
            var mois=['JANV.','FÉVR.','MARS','AVR.','MAI','JUIN','JUIL.','AOÛT','SEPT.','OCT.','NOV.','DÉC.'];
            var tabs=document.querySelectorAll('#sxTabs .sx-tab');
            tabs.forEach(function(t){
                var d=new Date();
                d.setDate(d.getDate()+parseInt(t.dataset.offset,10));
                t.querySelector('span').textContent=d.getDate()+' '+mois[d.getMonth()];
                t.addEventListener('click',function(){
                    tabs.forEach(function(x){x.classList.remove('active')});
                    t.classList.add('active');
                    loadAutomaticMatches(t.dataset.offset);
                });
            });
        })();

        // Connexion Supabase pour alimenter automatiquement les blocs comme la concurrence
        const supabaseUrl = "https://tqtkzkqampddxacmstk.supabase.co";
        const supabaseKey = "sb_publishable_KyUSPjb3kZ-exriMinWgOg_8Jck1VNa";

        async function loadAutomaticMatches(offset) {
            const grid = document.getElementById('hpGrid');
            try {
                const response = await fetch(`${supabaseUrl}/rest/v1/matches?select=*`, {
                    headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.length > 0) {
                        // Génération automatique des cartes au format exact de la concurrence
                        grid.innerHTML = data.map((m, idx) => {
                            const home = m.home_team || 'Équipe Domicile';
                            const away = m.away_team || 'Équipe Extérieur';
                            const league = m.competition || 'Championnat';
                            const pct = 75 + (idx % 15);

                            return `
                                <div class="hp-card">
                                    <div class="hp-badges">
                                        <span class="hp-badge top">🔥 TOP PICK</span>
                                        <span class="hp-badge safe">🛡️ Prono Sûr</span>
                                    </div>
                                    <div class="hp-meta">
                                        <span>${league}</span>
                                        <span style="color:#fff; font-weight:600;">En direct</span>
                                    </div>
                                    <div class="hp-teams">
                                        <div class="hp-team win"><div class="hp-logo"></div><span>${home}</span></div>
                                        <span class="hp-vs">VS</span>
                                        <div class="hp-team"><span>${away}</span><div class="hp-logo"></div></div>
                                    </div>
                                    <div class="hp-pick">
                                        <span class="hp-pick-name">${home} ou Match nul</span>
                                        <span class="hp-pick-pct">${pct}%</span>
                                    </div>
                                    <div class="hp-bar"><i style="width:${pct}%"></i></div>
                                    <div class="hp-opts">
                                        <div class="hp-opt active"><small>1X</small><b>${pct}%</b></div>
                                        <div class="hp-opt"><small>12</small><b>82%</b></div>
                                        <div class="hp-opt"><small>X2</small><b>45%</b></div>
                                    </div>
                                    <div class="hp-actions">
                                        <a href="#" class="hp-bet">Parier maintenant</a>
                                    </div>
                                </div>
                            `;
                        }).join('');
                        return;
                    }
                }
            } catch (e) {
                console.error("Erreur de chargement", e);
            }
            grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 3rem;">Aucun match disponible pour le moment.</div>`;
        }

        // Chargement initial au démarrage
        loadAutomaticMatches('0');
    </script>
</body>
</html>
