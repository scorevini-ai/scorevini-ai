<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCOREVINI AI — Live Automatic Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030303;
            --card-bg: #0c0707;
            --accent-blood: #8B0000;
            --accent-red: #FF0033;
            --border-color: #2b0a0a;
            --text-main: #FFFFFF;
            --text-muted: #8C8C8C;
            --gold: #f0b13c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(139, 0, 0, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(255, 0, 51, 0.05) 0%, transparent 40%);
        }

        aside {
            width: 280px;
            background: linear-gradient(180deg, #080101 0%, var(--bg-color) 100%);
            border-right: 2px solid var(--border-color);
            padding: 2.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 5px 0 30px rgba(139, 0, 0, 0.2);
        }

        .logo-text {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255, 0, 51, 0.5);
            margin-bottom: 3rem;
        }
        .logo-text span { color: var(--accent-red); text-shadow: 0 0 15px var(--accent-red); }

        .nav-links { list-style: none; display: flex; flex-direction: column; gap: 0.8rem; }
        .nav-links button {
            width: 100%; background: transparent; border: none; display: flex; align-items: center; gap: 1rem;
            padding: 0.85rem 1rem; color: var(--text-muted); border-radius: 6px; transition: all 0.3s ease;
            font-weight: 700; font-size: 1.1rem; cursor: pointer; text-align: left;
        }
        .nav-links button:hover, .nav-links button.active {
            background: linear-gradient(90deg, rgba(139, 0, 0, 0.4) 0%, rgba(255, 0, 51, 0.1) 100%);
            color: var(--text-main);
            border-left: 4px solid var(--accent-red);
            box-shadow: inset 0 0 15px rgba(255, 0, 51, 0.2);
        }

        main { flex: 1; padding: 2.5rem; overflow-y: auto; }

        .sx-tabs { display: flex; justify-content: center; gap: 40px; margin-bottom: 30px; }
        .sx-tab { background: none; border: 0; cursor: pointer; text-align: center; color: var(--text-muted); font-family: inherit; padding: 0; }
        .sx-tab b { display: block; font-size: 18px; font-weight: 700; }
        .sx-tab span { display: block; font-size: 13px; letter-spacing: .12em; margin-top: 4px; text-transform: uppercase; }
        .sx-tab.active { color: var(--text-main); }
        .sx-tab.active b { color: var(--accent-red); text-shadow: 0 0 10px rgba(255, 0, 51, 0.5); }

        .sx-filters { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; margin-bottom: 30px; }
        .sx-input {
            width: 100%; background: #030303; border: 1px solid var(--border-color); border-radius: 8px;
            color: var(--text-main); padding: 14px 18px; font-size: 1rem; font-family: inherit; outline: none;
        }
        .sx-input:focus { border-color: var(--accent-red); box-shadow: 0 0 10px rgba(255, 0, 51, 0.3); }

        .hp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 28px; }
        .hp-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-left: 4px solid var(--accent-red);
            border-radius: 22px; padding: 28px; box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.3s;
        }
        .hp-card:hover { transform: translateY(-3px); border-color: var(--accent-red); box-shadow: 0 8px 25px rgba(255, 0, 51, 0.2); }

        .hp-badges { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
        .hp-badge { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; }
        .hp-badge.top { background: var(--gold); color: #1a1a1a; }
        .hp-badge.safe { border: 1px solid var(--accent-blood); color: var(--accent-red); background: transparent; }

        .hp-meta { display: flex; align-items: center; justify-content: space-between; color: var(--text-muted); font-size: 15px; margin-bottom: 18px; }
        .hp-teams { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid #1a0808; margin-bottom: 20px; }
        .hp-team { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 600; }
        .hp-team.win { color: var(--accent-red); }
        .hp-logo { width: 36px; height: 36px; border-radius: 50%; background: #1a0808; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--text-muted); }
        .hp-vs { color: var(--text-muted); font-size: 18px; font-weight: 600; }

        .hp-pick { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
        .hp-pick-name { font-size: 18px; font-weight: 500; }
        .hp-pick-pct { font-size: 28px; font-weight: 700; color: var(--accent-red); font-family: 'Cinzel', serif; }
        .hp-bar { height: 10px; border-radius: 999px; background: #150505; overflow: hidden; margin-bottom: 20px; }
        .hp-bar i { display: block; height: 100%; background: var(--accent-red); border-radius: 999px; box-shadow: 0 0 10px var(--accent-red); }

        .hp-opts { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 20px; }
        .hp-opt { background: #050202; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 6px; text-align: center; }
        .hp-opt small { display: block; color: var(--text-muted); font-size: 14px; margin-bottom: 4px; }
        .hp-opt b { font-size: 18px; font-weight: 700; color: #d6dbe6; }
        .hp-opt.active { background: rgba(139, 0, 0, 0.4); border-color: var(--accent-red); }
        .hp-opt.active small, .hp-opt.active b { color: var(--accent-red); }

        .hp-bet { width: 100%; background: var(--accent-red); color: #fff; border: 0; border-radius: 12px; padding: 16px; font-size: 18px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; display: block; box-shadow: 0 5px 15px rgba(255, 0, 51, 0.4); }
        .hp-bet:hover { filter: brightness(1.2); }
    </style>
</head>
<body>

    <aside>
        <div>
            <div class="logo-text">SCOREVINI <span>AI</span></div>
            <ul class="nav-links">
                <li><button onclick="switchTab('all')" id="btn-all" class="active">🩸 Accueil</button></li>
                <li><button onclick="switchTab('today')" id="btn-today">⚡ Aujourd'hui</button></li>
                <li><button onclick="switchTab('tomorrow')" id="btn-tomorrow">📅 Demain</button></li>
                <li><button onclick="switchTab('history')" id="btn-history">📜 Historique</button></li>
                <li><button onclick="switchTab('stats')" id="btn-stats">📊 Statistiques</button></li>
            </ul>
        </div>
        <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
            <p style="font-family: 'Cinzel', serif; color: var(--accent-red);">SANG & VICTOIRE</p>
        </div>
    </aside>

    <main>
        <div class="sx-tabs" id="sxTabs">
            <button class="sx-tab" onclick="filterByDate('history', this)"><b>Hier</b><span id="date-yest"></span></button>
            <button class="sx-tab active" onclick="filterByDate('today', this)"><b>Aujourd'hui</b><span id="date-today"></span></button>
            <button class="sx-tab" onclick="filterByDate('tomorrow', this)"><b>Demain</b><span id="date-tom"></span></button>
        </div>

        <div class="sx-filters">
            <input class="sx-input" id="searchInput" type="text" placeholder="Rechercher une équipe, compétition..." oninput="handleSearch()">
        </div>

        <div class="hp-grid" id="hpGrid">
            <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem;">Connexion à l'API de football en cours...</div>
        </div>
    </main>

    <script>
        const mois = ['JANV.','FÉVR.','MARS','AVR.','MAI','JUIN','JUIL.','AOÛT','SEPT.','OCT.','NOV.','DÉC.'];
        const now = new Date();
        const formatDate = (d) => {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const todayStr = formatDate(now);
        const yest = new Date(); yest.setDate(now.getDate() - 1);
        const yestStr = formatDate(yest);
        const tom = new Date(); tom.setDate(now.getDate() + 1);
        const tomStr = formatDate(tom);

        document.getElementById('date-yest').textContent = yest.getDate() + ' ' + mois[yest.getMonth()];
        document.getElementById('date-today').textContent = now.getDate() + ' ' + mois[now.getMonth()];
        document.getElementById('date-tom').textContent = tom.getDate() + ' ' + mois[tom.getMonth()];

        const supabaseUrl = "https://tqtkzkqampddxacmstk.supabase.co";
        const supabaseKey = "sb_publishable_KyUSPjb3kZ-exriMinWgOg_8Jck1VNa";

        let liveMatches = [];
        let currentTab = 'today';

        async function fetchAPI() {
            try {
                const response = await fetch(`${supabaseUrl}/rest/v1/matches?select=*`, {
                    headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data && data.length > 0) {
                        liveMatches = data.map(m => ({
                            id: m.id,
                            date: m.match_date || todayStr,
                            league: m.competition || 'Football',
                            time: m.status || m.time || 'En direct',
                            home: m.home_team || 'Domicile',
                            away: m.away_team || 'Extérieur',
                            winTeam: m.winner || 'home',
                            pick: m.prediction || `${m.home_team || 'Domicile'} ou Nul`,
                            pct: m.confidence || 85,
                            opts: m.odds || {'1X': 85, '12': 78, 'X2': 52},
                            activeOpt: m.best_opt || '1X'
                        }));
                        filterByDate(currentTab);
                        return;
                    }
                }
            } catch (e) {
                console.error("Erreur API:", e);
            }

            // Si la base est vide, affiche un message propre
            document.getElementById('hpGrid').innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem;">Aucun match trouvé via l'API pour le moment.</div>`;
        }

        function renderMatches(data) {
            const grid = document.getElementById('hpGrid');
            if (!grid) return;

            if (!data || data.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem;">Aucun match pour cette date.</div>`;
                return;
            }

            grid.innerHTML = data.map(m => {
                const homeWin = m.winTeam === 'home' ? 'win' : '';
                const awayWin = m.winTeam === 'away' ? 'win' : '';

                return `
                    <div class="hp-card">
                        <div>
                            <div class="hp-badges">
                                <span class="hp-badge top">🔥 TOP PICK</span>
                                <span class="hp-badge safe">🛡️ Prono Sûr</span>
                            </div>
                            <div class="hp-meta">
                                <span>${m.league}</span>
                                <span style="color:var(--accent-red); font-weight:700;">${m.time}</span>
                            </div>
                            <div class="hp-teams">
                                <div class="hp-team ${homeWin}"><div class="hp-logo">🏠</div><span>${m.home}</span></div>
                                <span class="hp-vs">VS</span>
                                <div class="hp-team ${awayWin}"><span>${m.away}</span><div class="hp-logo">✈️</div></div>
                            </div>
                            <div class="hp-pick">
                                <span class="hp-pick-name">${m.pick}</span>
                                <span class="hp-pick-pct">${m.pct}%</span>
                            </div>
                            <div class="hp-bar"><i style="width:${m.pct}%"></i></div>
                            <div class="hp-opts">
                                <div class="hp-opt ${m.activeOpt === '1X' ? 'active' : ''}"><small>1X</small><b>${m.opts['1X'] || 85}%</b></div>
                                <div class="hp-opt ${m.activeOpt === '12' ? 'active' : ''}"><small>12</small><b>${m.opts['12'] || 78}%</b></div>
                                <div class="hp-opt ${m.activeOpt === 'X2' ? 'active' : ''}"><small>X2</small><b>${m.opts['X2'] || 52}%</b></div>
                            </div>
                        </div>
                        <button class="hp-bet">ANALYSE COMPLÈTE 🩸</button>
                    </div>
                `;
            }).join('');
        }

        function filterByDate(type, btnElement) {
            currentTab = type;
            if (btnElement) {
                document.querySelectorAll('.sx-tabs .sx-tab').forEach(btn => btn.classList.remove('active'));
                btnElement.classList.add('active');
            }

            let filtered = [];
            if (type === 'history') {
                filtered = liveMatches.filter(m => m.date < todayStr);
            } else if (type === 'today') {
                filtered = liveMatches.filter(m => m.date === todayStr);
            } else if (type === 'tomorrow') {
                filtered = liveMatches.filter(m => m.date === tomStr);
            } else {
                filtered = liveMatches;
            }
            renderMatches(filtered);
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + tab).classList.add('active');

            if (tab === 'stats') {
                document.getElementById('hpGrid').innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px;">
                        <h3 style="color: var(--accent-red); font-family: 'Cinzel', serif; font-size: 1.8rem; margin-bottom:1rem;">STATISTIQUES GLOBALES</h3>
                        <p style="font-size: 1.2rem;">Matchs récupérés via l'API : <strong>${liveMatches.length}</strong></p>
                        <p style="color: var(--text-muted); margin-top: 0.5rem;">Moteur actif.</p>
                    </div>
                `;
                return;
            }

            if (tab === 'history') { filterByDate('history'); return; }
            if (tab === 'today') { filterByDate('today'); return; }
            if (tab === 'tomorrow') { filterByDate('tomorrow'); return; }

            renderMatches(liveMatches);
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let baseList = liveMatches;
            if (currentTab === 'history') baseList = liveMatches.filter(m => m.date < todayStr);
            else if (currentTab === 'today') baseList = liveMatches.filter(m => m.date === todayStr);
            else if (currentTab === 'tomorrow') baseList = liveMatches.filter(m => m.date === tomStr);

            const filtered = baseList.filter(m => {
                return m.home.toLowerCase().includes(query) || m.away.toLowerCase().includes(query) || m.league.toLowerCase().includes(query);
            });
            renderMatches(filtered);
        }

        fetchAPI();
    </script>
</body>
</html>
