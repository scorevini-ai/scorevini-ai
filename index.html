<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCOREVINI AI — Horror Red & Black Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030303;
            --card-bg: #0c0707;
            --accent-blood: #8B0000;
            --accent-red: #FF0033;
            --border-color: #2b0a0a;
            --text-main: #FFFFFF;
            --text-muted: #8C8C8C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(139, 0, 0, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(255, 0, 51, 0.05) 0%, transparent 40%);
        }

        aside {
            width: 280px;
            background: linear-gradient(180deg, #080101 0%, var(--bg-color) 100%);
            border-right: 2px solid var(--border-color);
            padding: 2.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 5px 0 30px rgba(139, 0, 0, 0.2);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 3rem;
        }

        .logo-text {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255, 0, 51, 0.5);
        }

        .logo-text span {
            color: var(--accent-red);
            text-shadow: 0 0 15px var(--accent-red);
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .nav-links button {
            width: 100%;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.85rem 1rem;
            color: var(--text-muted);
            border-radius: 6px;
            transition: all 0.3s ease;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            text-align: left;
        }

        .nav-links button:hover, .nav-links button.active {
            background: linear-gradient(90deg, rgba(139, 0, 0, 0.4) 0%, rgba(255, 0, 51, 0.1) 100%);
            color: var(--text-main);
            border-left: 4px solid var(--accent-red);
            box-shadow: inset 0 0 15px rgba(255, 0, 51, 0.2);
        }

        main {
            flex: 1;
            padding: 2.5rem;
            overflow-y: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        .search-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1.2rem;
            border-radius: 8px;
            color: var(--text-main);
            width: 350px;
            outline: none;
            font-size: 1rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            transition: all 0.3s;
        }

        .search-bar:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.3), inset 0 0 10px rgba(0,0,0,0.8);
        }

        .hero {
            background: linear-gradient(135deg, rgba(80, 0, 0, 0.6) 0%, rgba(5, 2, 2, 0.95) 100%), 
                        url('https://images.unsplash.com/photo-1518091043644-c1d4457512c6?q=80&w=1200&auto=format&fit=crop') center/cover;
            border: 1px solid var(--accent-blood);
            border-radius: 12px;
            padding: 3rem;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.3);
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-red), transparent);
            box-shadow: 0 0 15px var(--accent-red);
        }

        .hero h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.3rem;
            font-weight: 900;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
        }

        .hero h1 span {
            color: var(--accent-red);
            text-shadow: 0 0 20px rgba(255, 0, 51, 0.8);
        }

        .hero p {
            color: #b3b3b3;
            font-size: 1.15rem;
            max-width: 650px;
        }

        .badge-live {
            display: inline-block;
            background: rgba(139, 0, 0, 0.4);
            color: #ff9999;
            border: 1px solid var(--accent-red);
            padding: 0.35rem 1rem;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            box-shadow: 0 0 10px rgba(255, 0, 51, 0.3);
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title::before {
            content: '';
            width: 6px;
            height: 22px;
            background: var(--accent-red);
            box-shadow: 0 0 10px var(--accent-red);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }

        .card:hover {
            border-color: var(--accent-red);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(255, 0, 51, 0.25);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            border-bottom: 1px solid #1a0808;
            padding-bottom: 0.5rem;
        }

        .teams {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-align: center;
        }

        .prediction-box {
            background: #050202;
            border: 1px solid #200808;
            border-radius: 6px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        .market-name {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        .market-selection {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .probability {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent-red);
            text-shadow: 0 0 15px rgba(255, 0, 51, 0.6);
            font-family: 'Cinzel', serif;
        }

        .card-footer {
            text-align: center;
            font-size: 0.85rem;
            color: #ff4d4d;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <aside>
        <div>
            <div class="logo-area">
                <div class="logo-text">SCOREVINI <span>AI</span></div>
            </div>
            <ul class="nav-links">
                <li><button onclick="filterTab('all')" id="btn-all" class="active">🩸 Accueil</button></li>
                <li><button onclick="filterTab('today')" id="btn-today">⚡ Aujourd'hui</button></li>
                <li><button onclick="filterTab('tomorrow')" id="btn-tomorrow">📅 Demain</button></li>
                <li><button onclick="filterTab('history')" id="btn-history">📜 Historique</button></li>
                <li><button onclick="filterTab('stats')" id="btn-stats">📊 Statistiques</button></li>
            </ul>
        </div>
        <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
            <p style="font-family: 'Cinzel', serif; color: var(--accent-red);">SANG & VICTOIRE</p>
        </div>
    </aside>

    <main>
        <header>
            <input type="text" id="searchInput" class="search-bar" placeholder="Rechercher équipe, pays, région..." oninput="handleSearch()">
            <div style="font-weight: 700; font-size: 0.95rem; color: #ff3333; text-shadow: 0 0 10px rgba(255,0,51,0.5);">💀 SYSTÈME ACTIF</div>
        </header>

        <div class="hero">
            <span class="badge-live">TRAITEMENT SANGUIN ≥ 78%</span>
            <h1>LE TERRAIN N'APPARTIENT QU'À CEUX <span>QUI DOMINENT</span></h1>
            <p>Analyse automatisée multi-régions (Europe, Amérique, Afrique) connectée en temps réel.</p>
        </div>

        <div class="section-title" id="sectionTitle">Sélections Sanglantes (Fiabilité ≥ 78%)</div>

        <div class="grid" id="predictionsGrid">
            <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-muted);">
                Invocation des données mondiales...
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = "https://tqtkzkqampddxacmstk.supabase.co";
        const supabaseKey = "sb_publishable_KyUSPjb3kZ-exriMinWgOg_8Jck1VNa"; 
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let allPredictions = [];
        let currentFilter = 'all';

        async function loadData() {
            try {
                const { data, error } = await _supabase
                    .from('predictions')
                    .select('*, matches(*, competitions(name, country))')
                    .gte('probability', 78);

                if (error || !data || data.length === 0) {
                    // Données de secours par défaut si la base est vide
                    allPredictions = [
                        { market_type: 'Résultat du match', selection: 'Victoire Real Madrid', probability: 88, matches: { match_date: new Date().toISOString(), competitions: { name: 'La Liga', country: 'Espagne' }, home_team: 'Real Madrid', away_team: 'Valencia' } },
                        { market_type: 'Total de buts', selection: 'Plus de 2.5 buts', probability: 84, matches: { match_date: new Date(Date.now() + 86400000).toISOString(), competitions: { name: 'Premier League', country: 'Angleterre' }, home_team: 'Manchester City', away_team: 'Arsenal' } }
                    ];
                } else {
                    allPredictions = data;
                }

                filterTab(currentFilter);
            } catch (e) {
                console.error("Erreur de chargement", e);
            }
        }

        function renderPredictions(dataToRender) {
            const grid = document.getElementById('predictionsGrid');
            if (!grid) return;

            if (dataToRender.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px;">
                        <h3 style="color: var(--text-main); margin-bottom: 0.5rem; font-family: 'Cinzel', serif;">Aucune victime trouvée</h3>
                        <p style="color: var(--text-muted);">Aucun match ne correspond à cette période ou région.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = dataToRender.map(p => {
                const matchDate = new Date(p.matches?.match_date || Date.now());
                const dateOptions = { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' };
                const dateStr = matchDate.toLocaleDateString('fr-FR', dateOptions);
                const compName = p.matches?.competitions?.name || 'Compétition';
                const countryName = p.matches?.competitions?.country ? ` (${p.matches.competitions.country})` : '';
                const teamDisplay = p.matches?.home_team && p.matches?.away_team 
                    ? `${p.matches.home_team} vs ${p.matches.away_team}` 
                    : p.market_type;

                return `
                    <div class="card">
                        <div class="card-header">
                            <span>${compName}${countryName}</span>
                            <span>${dateStr}</span>
                        </div>
                        <div class="teams">${teamDisplay}</div>
                        <div class="prediction-box">
                            <div class="market-name">${p.market_type}</div>
                            <div class="market-selection">${p.selection}</div>
                            <div class="probability">${p.probability}%</div>
                        </div>
                        <div class="card-footer">Pronostic Actif 🩸</div>
                    </div>
                `;
            }).join('');
        }

        function filterTab(tab) {
            currentFilter = tab;
            document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById('btn-' + tab);
            if (activeBtn) activeBtn.classList.add('active');

            const now = new Date();
            const todayStr = now.toDateString();

            const tomorrow = new Date(now);
            tomorrow.setDate(now.getDate() + 1);
            const tomorrowStr = tomorrow.toDateString();

            let filtered = allPredictions;

            if (tab === 'today') {
                filtered = allPredictions.filter(p => {
                    if (!p.matches?.match_date) return false;
                    return new Date(p.matches.match_date).toDateString() === todayStr;
                });
            } else if (tab === 'tomorrow') {
                filtered = allPredictions.filter(p => {
                    if (!p.matches?.match_date) return false;
                    return new Date(p.matches.match_date).toDateString() === tomorrowStr;
                });
            } else if (tab === 'history') {
                filtered = allPredictions.filter(p => {
                    if (!p.matches?.match_date) return false;
                    const d = new Date(p.matches.match_date);
                    return d < now && d.toDateString() !== todayStr;
                });
            } else if (tab === 'stats') {
                document.getElementById('predictionsGrid').innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px;">
                        <h3 style="color: var(--accent-red); margin-bottom: 1rem; font-family: 'Cinzel', serif; font-size: 1.8rem;">STATISTIQUES GLOBALES</h3>
                        <p style="color: var(--text-main); font-size: 1.2rem; margin-bottom: 0.5rem;">Total pronostics analysés (≥ 80%) : <strong>${allPredictions.length}</strong></p>
                        <p style="color: var(--text-muted);">Moteur algorithmique multi-régions opérationnel.</p>
                    </div>
                `;
                return;
            }

            renderPredictions(filtered);
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allPredictions.filter(p => {
                const comp = (p.matches?.competitions?.name || '').toLowerCase();
                const country = (p.matches?.competitions?.country || '').toLowerCase();
                const market = (p.market_type || '').toLowerCase();
                const selection = (p.selection || '').toLowerCase();
                const home = (p.matches?.home_team || '').toLowerCase();
                const away = (p.matches?.away_team || '').toLowerCase();
                return comp.includes(query) || country.includes(query) || market.includes(query) || selection.includes(query) || home.includes(query) || away.includes(query);
            });
            renderPredictions(filtered);
        }

        loadData();
    </script>
</body>
</html>
